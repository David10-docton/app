<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa"/>
      <stop offset="100%" style="stop-color:#e9ecef"/>
    </linearGradient>
    <linearGradient id="pad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#dc2626"/>
      <stop offset="100%" style="stop-color:#991b1b"/>
    </linearGradient>
    <linearGradient id="metal1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6b7280"/>
      <stop offset="100%" style="stop-color:#374151"/>
    </linearGradient>
    <filter id="shadow1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="6" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#bg1)" rx="8"/>
  <!-- Left brake pad -->
  <g transform="translate(80, 40)" filter="url(#shadow1)">
    <rect x="0" y="0" width="100" height="200" rx="6" fill="url(#metal1)"/>
    <rect x="8" y="20" width="84" height="160" rx="4" fill="url(#pad1)"/>
    <rect x="15" y="40" width="70" height="8" rx="2" fill="#7f1d1d" opacity="0.5"/>
    <rect x="15" y="60" width="70" height="8" rx="2" fill="#7f1d1d" opacity="0.5"/>
    <rect x="15" y="80" width="70" height="8" rx="2" fill="#7f1d1d" opacity="0.5"/>
    <rect x="15" y="100" width="70" height="8" rx="2" fill="#7f1d1d" opacity="0.5"/>
    <rect x="15" y="120" width="70" height="8" rx="2" fill="#7f1d1d" opacity="0.5"/>
    <rect x="15" y="140" width="70" height="8" rx="2" fill="#7f1d1d" opacity="0.5"/>
    <circle cx="50" cy="190" r="6" fill="#1f2937"/>
  </g>
  <!-- Right brake pad -->
  <g transform="translate(200, 40)" filter="url(#shadow1)">
    <rect x="0" y="0" width="100" height="200" rx="6" fill="url(#metal1)"/>
    <rect x="8" y="20" width="84" height="160" rx="4" fill="url(#pad1)"/>
    <rect x="15" y="40" width="70" height="8" rx="2" fill="#7f1d1d" opacity="0.5"/>
    <rect x="15" y="60" width="70" height="8" rx="2" fill="#7f1d1d" opacity="0.5"/>
    <rect x="15" y="80" width="70" height="8" rx="2" fill="#7f1d1d" opacity="0.5"/>
    <rect x="15" y="100" width="70" height="8" rx="2" fill="#7f1d1d" opacity="0.5"/>
    <rect x="15" y="120" width="70" height="8" rx="2" fill="#7f1d1d" opacity="0.5"/>
    <rect x="15" y="140" width="70" height="8" rx="2" fill="#7f1d1d" opacity="0.5"/>
    <circle cx="50" cy="190" r="6" fill="#1f2937"/>
  </g>
  <!-- Label -->
  <text x="200" y="270" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#374151">Plaquettes de Frein</text>
</svg>